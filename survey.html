<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2026 HVAC 세미나 만족도 설문</title>
  <meta name="description" content="2026 HVAC Engineering Expert Seminar 만족도 설문 참여 및 클로징 럭키드로우 경품 응모">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://lghvac.app/survey.html">
  <meta property="og:title" content="2026 HVAC 세미나 만족도 설문">
  <meta property="og:description" content="세미나 만족도 설문에 참여하시고 만찬 럭키드로우 경품 추첨 기회를 잡으세요!">
  <meta property="og:image" content="https://lghvac.app/assets/hvac-2026-title-banner-centered.jpg">
  <meta property="og:image:secure_url" content="https://lghvac.app/assets/hvac-2026-title-banner-centered.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <link rel="image_src" href="https://lghvac.app/assets/hvac-2026-title-banner-centered.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://lghvac.app/assets/hvac-2026-title-banner-centered.jpg">
  <link rel="stylesheet" href="./assets/hvac-common.css">
  <script src="./assets/hvac-core.js"></script>
  <style>
    :root {
      --bg-dark: #070a0e;
      --card-bg: rgba(18, 22, 31, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --gold-primary: #f3c448;
      --green-primary: #10b981;
      --text-main: #f3f4f6;
      --text-muted: rgba(255, 255, 255, 0.6);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 16px 60px;
    }

    .survey-container {
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
      padding-top: 20px;
    }

    /* Top navigation header */
    .survey-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .btn-back-nav {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      transition: all 0.2s;
    }
    .btn-back-nav:hover { background: rgba(255, 255, 255, 0.15); }

    .step-pill {
      font-size: 13px;
      font-weight: 800;
      color: var(--gold-primary);
      background: rgba(243, 196, 72, 0.12);
      border: 1px solid rgba(243, 196, 72, 0.3);
      padding: 4px 12px;
      border-radius: 99px;
      letter-spacing: -0.01em;
    }

    .progress-track {
      width: 100%;
      height: 5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #f3c448, #10b981);
      border-radius: 99px;
      transition: width 0.3s ease;
      width: 33.33%;
    }

    /* User identification banner */
    .user-pill-banner {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12.5px;
      color: #a7f3d0;
    }

    .survey-page-title {
      font-size: 21px;
      font-weight: 900;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
      color: #fff;
    }

    .survey-page-sub {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 22px;
    }

    /* Question Card */
    .question-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(12px);
      transition: border-color 0.2s, transform 0.2s;
    }

    .question-card.highlight-error {
      border-color: #ef4444;
      animation: shake 0.35s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .question-label {
      font-size: 15px;
      font-weight: 800;
      line-height: 1.45;
      margin-bottom: 14px;
      color: #f9fafb;
    }

    .question-label .req-star {
      color: #ef4444;
      margin-left: 2px;
    }

    /* Star rating widget */
    .stars-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      user-select: none;
    }

    .star-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 32px;
      line-height: 1;
      color: rgba(255, 255, 255, 0.2);
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.15s;
      padding: 0 4px;
      -webkit-tap-highlight-color: transparent;
    }

    .star-btn:active { transform: scale(1.25); }

    .star-btn.active {
      color: #f3c448;
      text-shadow: 0 0 16px rgba(243, 196, 72, 0.6);
    }

    .rating-caption {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #f3c448;
      min-height: 18px;
    }

    /* Textarea for open feedback */
    .survey-textarea {
      width: 100%;
      min-height: 90px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 14px;
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .survey-textarea:focus {
      border-color: #f3c448;
      box-shadow: 0 0 0 3px rgba(243, 196, 72, 0.15);
    }

    /* Bottom action buttons */
    .survey-bottom-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 26px;
    }

    .btn-step-prev {
      flex: 1;
      height: 52px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-step-prev:hover { background: rgba(255, 255, 255, 0.15); }

    .btn-step-next {
      flex: 2;
      height: 52px;
      background: linear-gradient(135deg, #f3c448 0%, #e5b338 100%);
      border: none;
      color: #050808;
      border-radius: 14px;
      font-size: 15.5px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(243, 196, 72, 0.35);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-step-next:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 22px rgba(243, 196, 72, 0.45);
    }

    .btn-submit-final {
      flex: 2;
      height: 52px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      border: none;
      color: #ffffff;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-submit-final:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 25px rgba(16, 185, 129, 0.55);
    }

    /* Success Screen */
    .success-card {
      text-align: center;
      padding: 40px 20px;
      background: var(--card-bg);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 20px;
      box-shadow: 0 0 50px rgba(16, 185, 129, 0.2);
    }
    .success-icon { font-size: 64px; margin-bottom: 16px; }
    .success-title { font-size: 22px; font-weight: 900; margin-bottom: 10px; color: #34d399; }
    .success-desc { font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 26px; }

    .btn-success-action {
      display: block;
      width: 100%;
      height: 50px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="survey-container">
    <!-- 상단 네비게이션 & 진행 바 -->
    <div class="survey-top-bar" id="surveyNavTop">
      <button class="btn-back-nav" id="btnBackNav" type="button" aria-label="이전 화면">←</button>
      <div class="step-pill" id="stepIndicator">1 / 3 페이지</div>
    </div>
    <div class="progress-track" id="surveyProgressTrack">
      <div class="progress-fill" id="progressFill" style="width: 33.33%;"></div>
    </div>

    <!-- 사용자 자동 식별 배너 -->
    <div class="user-pill-banner" id="userPillBanner">
      <span style="font-size: 16px;">👤</span>
      <span id="userPillText">참석자 확인 중...</span>
    </div>

    <!-- 설문 작성 폼 본체 -->
    <form id="formSurvey" onsubmit="return false;">
      <div id="surveyPageContainer">
        <!-- JS 동적 렌더링 -->
      </div>

      <div class="survey-bottom-actions" id="bottomActions">
        <button class="btn-step-prev" id="btnStepPrev" type="button" style="display: none;">← 이전</button>
        <button class="btn-step-next" id="btnStepNext" type="button">다음 (과정별 만족도 2/3 ➔)</button>
        <button class="btn-submit-final" id="btnSubmitFinal" type="button" style="display: none;">
          설문 제출 &amp; 럭키드로우 응모 🎉
        </button>
      </div>
    </form>

    <!-- 완료 화면 (제출 후 전환) -->
    <div class="success-card" id="screenSuccess" style="display: none;">
      <div class="success-icon">🎉</div>
      <h2 class="success-title">만족도 설문 제출 완료!</h2>
      <p class="success-desc">
        소중한 의견과 피드백을 주셔서 진심으로 감사드립니다.<br>
        <strong>클로징 럭키드로우 추첨 응모 자격</strong>이 정상적으로 부여되었습니다!
      </p>
      <a href="./checkin.html" class="btn-success-action" style="background: var(--gold-primary); color: #040906;">
        📅 세미나 대시보드로 이동
      </a>
      <a href="./quiz.html" class="btn-success-action" style="background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.15);">
        💡 실시간 선착순 퀴즈 풀러 가기
      </a>
    </div>
  </div>

  <script>
    // 1. 현재 사용자 로드
    const user = (window.HVAC && window.HVAC.getUserChecked && window.HVAC.getUserChecked())
      || JSON.parse(localStorage.getItem('hvac_user_checked') || '{}');

    const cleanEmail = String(user.email || '').toLowerCase().replace('@lge.com', '');
    const userBannerText = document.getElementById('userPillText');
    if (user.name) {
      const posStr = user.position ? ` ${user.position}` : '';
      userBannerText.textContent = `${user.name}${posStr} (${cleanEmail || '사내메일'}) 님으로 자동 응답 중`;
    } else {
      userBannerText.textContent = '게스트 참석자로 응답 중 (체크인 시 이름이 자동 연동됩니다)';
    }

    // 2. 설문 설정 로드 (hvac-core 연동 또는 기본값)
    let surveyConfig = (window.HVAC && window.HVAC.getSurveyConfig)
      ? window.HVAC.getSurveyConfig()
      : (JSON.parse(localStorage.getItem('hvac_survey_config') || 'null') || (window.HVAC && window.HVAC.DEFAULT_SURVEY_CONFIG));

    let currentPageIdx = 0;
    const userResponses = {}; // { q0: 5, q1: 4, q8: "..." }

    // 기존 저장된 설문 응답이 있는지 확인
    try {
      const savedAnswers = JSON.parse(localStorage.getItem('hvac_my_survey_answers') || '{}');
      Object.assign(userResponses, savedAnswers);
    } catch (e) {}

    // 뒤로가기 버튼
    document.getElementById('btnBackNav').addEventListener('click', () => {
      if (currentPageIdx > 0) {
        showPage(currentPageIdx - 1);
      } else {
        if (document.referrer && document.referrer.includes(location.host)) {
          history.back();
        } else {
          window.location.href = './quiz.html';
        }
      }
    });

    const RATING_CAPTIONS = {
      1: '⭐ 1점 (매우 불만족)',
      2: '⭐ 2점 (불만족)',
      3: '⭐ 3점 (보통)',
      4: '⭐ 4점 (만족)',
      5: '⭐ 5점 (매우 만족)'
    };

    // 3. 페이지 렌더링
    function showPage(pageIdx) {
      const pages = surveyConfig.pages || [];
      if (pageIdx < 0 || pageIdx >= pages.length) return;
      currentPageIdx = pageIdx;

      // 상단 인디케이터
      document.getElementById('stepIndicator').textContent = `${pageIdx + 1} / ${pages.length} 페이지`;
      const pct = ((pageIdx + 1) / pages.length) * 100;
      document.getElementById('progressFill').style.width = pct + '%';

      // 페이지 컨테이너 생성
      const container = document.getElementById('surveyPageContainer');
      const pageData = pages[pageIdx];

      let html = `
        <h2 class="survey-page-title">${escapeHtml(pageData.pageTitle || '')}</h2>
        <p class="survey-page-sub">${escapeHtml(pageData.pageSub || '')}</p>
      `;

      (pageData.questions || []).forEach(q => {
        const val = userResponses[q.id] !== undefined ? userResponses[q.id] : '';
        html += `
          <div class="question-card" id="card_${q.id}" data-qid="${q.id}">
            <div class="question-label">
              ${escapeHtml(q.label)}
              ${q.required ? '<span class="req-star" title="필수 문항">*</span>' : ''}
            </div>
        `;

        if (q.type === 'rating') {
          const currentScore = Number(val) || 0;
          html += `
            <div class="stars-wrap" data-qid="${q.id}">
          `;
          for (let star = 1; star <= (q.max || 5); star++) {
            const isActive = star <= currentScore;
            html += `
              <button type="button" class="star-btn ${isActive ? 'active' : ''}" data-score="${star}" aria-label="${star}점">
                ★
              </button>
            `;
          }
          html += `
            </div>
            <div class="rating-caption" id="caption_${q.id}">${currentScore ? RATING_CAPTIONS[currentScore] || '' : '별을 터치하여 평가해 주세요'}</div>
          `;
        } else {
          // 주관식 text / textarea
          html += `
            <textarea class="survey-textarea" data-qid="${q.id}" placeholder="${escapeHtml(q.placeholder || '답변을 입력하세요.')}">${escapeHtml(val)}</textarea>
          `;
        }

        html += `</div>`;
      });

      container.innerHTML = html;

      // 별점 클릭 이벤트 바인딩
      container.querySelectorAll('.star-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const score = parseInt(btn.getAttribute('data-score'), 10);
          const starsWrap = btn.closest('.stars-wrap');
          const qid = starsWrap.getAttribute('data-qid');
          userResponses[qid] = score;

          // 별 하이라이트 갱신
          starsWrap.querySelectorAll('.star-btn').forEach(s => {
            const sVal = parseInt(s.getAttribute('data-score'), 10);
            s.classList.toggle('active', sVal <= score);
          });

          const capEl = document.getElementById(`caption_${qid}`);
          if (capEl) capEl.textContent = RATING_CAPTIONS[score] || `${score}점`;

          const card = document.getElementById(`card_${qid}`);
          if (card) card.classList.remove('highlight-error');

          saveTempAnswers();
        });
      });

      // 텍스트 입력 이벤트 바인딩
      container.querySelectorAll('.survey-textarea').forEach(tx => {
        tx.addEventListener('input', () => {
          const qid = tx.getAttribute('data-qid');
          userResponses[qid] = tx.value.trim();
          saveTempAnswers();
        });
      });

      // 하단 버튼 제어
      const btnPrev = document.getElementById('btnStepPrev');
      const btnNext = document.getElementById('btnStepNext');
      const btnSubmit = document.getElementById('btnSubmitFinal');

      btnPrev.style.display = (pageIdx === 0) ? 'none' : 'block';

      if (pageIdx === pages.length - 1) {
        btnNext.style.display = 'none';
        btnSubmit.style.display = 'block';
      } else {
        btnNext.style.display = 'block';
        btnSubmit.style.display = 'none';
        const nextTargetTitle = (pages[pageIdx + 1]?.pageTitle || '').split(' ')[0] || '다음';
        btnNext.textContent = `다음 (${nextTargetTitle} ${pageIdx + 2}/${pages.length} ➔)`;
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function saveTempAnswers() {
      try {
        localStorage.setItem('hvac_my_survey_answers', JSON.stringify(userResponses));
      } catch (e) {}
    }

    // 필수 문항 검증
    function validateCurrentPage() {
      const pageData = surveyConfig.pages[currentPageIdx];
      if (!pageData) return true;

      let firstErrCard = null;
      (pageData.questions || []).forEach(q => {
        const card = document.getElementById(`card_${q.id}`);
        if (!card) return;
        const val = userResponses[q.id];
        if (q.required && (val === undefined || val === '' || val === null)) {
          card.classList.add('highlight-error');
          if (!firstErrCard) firstErrCard = card;
        } else {
          card.classList.remove('highlight-error');
        }
      });

      if (firstErrCard) {
        firstErrCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return false;
      }
      return true;
    }

    // 다음/이전 버튼 핸들러
    document.getElementById('btnStepPrev').addEventListener('click', () => {
      if (currentPageIdx > 0) showPage(currentPageIdx - 1);
    });

    document.getElementById('btnStepNext').addEventListener('click', () => {
      if (!validateCurrentPage()) return;
      showPage(currentPageIdx + 1);
    });

    // 최종 제출
    document.getElementById('btnSubmitFinal').addEventListener('click', async () => {
      if (!validateCurrentPage()) return;

      const btn = document.getElementById('btnSubmitFinal');
      btn.disabled = true;
      btn.textContent = '제출 및 동기화 중... ⏳';

      // 평균 평점 계산
      let totalRating = 0;
      let ratingCount = 0;
      for (const k in userResponses) {
        const num = Number(userResponses[k]);
        if (!isNaN(num) && num >= 1 && num <= 5 && !k.startsWith('q8') && !k.startsWith('q9') && !k.startsWith('q10') && !k.startsWith('q11')) {
          totalRating += num;
          ratingCount++;
        }
      }
      const avgScore = ratingCount > 0 ? parseFloat((totalRating / ratingCount).toFixed(2)) : 5.0;

      const surveyPayload = {
        email: cleanEmail || 'guest_' + Date.now(),
        name: user.name || '참석자',
        checkinId: user.checkinId || (user.seq ? 'HVAC-' + String(user.seq).padStart(3, '0') : '-'),
        position: user.position || user.title || '',
        dept: user.dept || '',
        empNo: user.empNo || '',
        answers: userResponses,
        avgScore: avgScore,
        submittedAt: new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
        date: new Date().toISOString().slice(0, 10)
      };

      // 1) 로컬 스토리지 기록
      try {
        localStorage.setItem('hvac_survey_done', 'true');
        localStorage.setItem('hvac_my_survey_submission', JSON.stringify(surveyPayload));

        let localSurveys = JSON.parse(localStorage.getItem('hvac_survey_responses') || '[]');
        if (!Array.isArray(localSurveys)) localSurveys = [];
        const existIdx = localSurveys.findIndex(s => s.email === surveyPayload.email);
        if (existIdx >= 0) localSurveys[existIdx] = surveyPayload;
        else localSurveys.unshift(surveyPayload);
        localStorage.setItem('hvac_survey_responses', JSON.stringify(localSurveys));
      } catch (e) {}

      // 2) Firebase 클라우드 DB 실시간 전송
      if (window.HVAC && HVAC.cloud && HVAC.cloud.pushSurvey) {
        try {
          await HVAC.cloud.pushSurvey(surveyPayload);
        } catch (e) {}
      }

      // 화면 완료 카드로 전환
      document.getElementById('formSurvey').style.display = 'none';
      document.getElementById('surveyNavTop').style.display = 'none';
      document.getElementById('surveyProgressTrack').style.display = 'none';
      document.getElementById('userPillBanner').style.display = 'none';
      document.getElementById('screenSuccess').style.display = 'block';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    function escapeHtml(str) {
      return String(str || '').replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // 초기 렌더링
    showPage(0);

    // 관리자에서 설문 문항 변경 시 실시간 반영
    if (window.HVAC) {
      HVAC.onConfigUpdated((keys) => {
        if (keys.includes('hvac_survey_config')) {
          surveyConfig = HVAC.getSurveyConfig();
          showPage(currentPageIdx);
        }
      });
    }
  </script>
