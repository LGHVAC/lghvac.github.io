<!DOCTYPE html>
<html lang="ko" data-hvac-page="quiz-winners">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세션별 퀴즈 당첨자 발표 (사회자용) | 제10회 2026 HVAC 전문가 세미나</title>
  <link rel="icon" href="./assets/favicon.ico">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="./assets/hvac-core.js"></script>
  <style>
    :root {
      --bg: #040c07;
      --card-bg: rgba(14, 28, 19, 0.82);
      --card-border: rgba(243, 196, 72, 0.28);
      --primary: #10b981;
      --gold: #f3c448;
      --gold-light: #ffd900;
      --text: #ffffff;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Pretendard Variable", Pretendard, -apple-system, sans-serif; }
    body {
      background: radial-gradient(circle at 50% 15%, #0e2718 0%, var(--bg) 75%);
      color: var(--text);
      min-height: 100vh;
      padding: 20px 24px 60px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* 상단 헤더 배너 */
    .winners-hero-header {
      background: linear-gradient(180deg, rgba(22, 44, 30, 0.95) 0%, rgba(10, 22, 14, 0.95) 100%);
      border: 1.5px solid var(--card-border);
      border-radius: 20px;
      padding: 22px 28px;
      margin-bottom: 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      position: relative;
      overflow: hidden;
    }

    .hero-badge-pill {
      display: inline-block;
      background: rgba(243, 196, 72, 0.15);
      border: 1px solid var(--gold);
      color: var(--gold-light);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.08em;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 8px;
    }

    .hero-title {
      font-size: 23px;
      font-weight: 950;
      color: #ffffff;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hero-desc {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 12px;
    }

    .rules-banner {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px 16px;
      font-size: 12.5px;
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      align-items: center;
    }

    .rule-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .rule-item.ok { color: #34d399; font-weight: 750; }
    .rule-item.no { color: #f87171; font-weight: 750; }
    .rule-item.star { color: var(--gold-light); font-weight: 850; }

    /* 툴바 */
    .hero-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      flex-wrap: wrap;
      gap: 10px;
    }

    .btn-action {
      background: linear-gradient(135deg, rgba(243, 196, 72, 0.22) 0%, rgba(217, 119, 6, 0.22) 100%);
      border: 1.5px solid var(--gold);
      color: var(--gold-light);
      padding: 9px 18px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: var(--gold);
      color: #040906;
      transform: translateY(-2px);
      box-shadow: 0 4px 18px rgba(243, 196, 72, 0.4);
    }

    .btn-action.sec {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .btn-action.sec:hover {
      background: rgba(16, 185, 129, 0.2);
      border-color: #10b981;
      color: #34d399;
    }

    /* 6개 세션 그리드 */
    .sessions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
      gap: 20px;
    }

    @media (max-width: 900px) {
      .sessions-grid { grid-template-columns: 1fr; }
    }

    .session-winner-card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      border-radius: 18px;
      padding: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      transition: transform 0.2s;
    }

    .session-winner-card:hover {
      transform: translateY(-2px);
      border-color: rgba(243, 196, 72, 0.55);
    }

    .session-card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .session-card-head .sess-id {
      font-size: 11px;
      font-weight: 900;
      color: var(--gold-light);
      letter-spacing: 0.06em;
    }

    .session-card-head .sess-title {
      font-size: 16px;
      font-weight: 900;
      color: #ffffff;
      margin-top: 2px;
    }

    .session-card-head .sess-speaker {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .top3-pill {
      background: rgba(243, 196, 72, 0.15);
      border: 1px solid rgba(243, 196, 72, 0.45);
      color: var(--gold-light);
      font-size: 11.5px;
      font-weight: 850;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
    }

    /* 당첨자 아이템 행 */
    .winner-rank-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      margin-bottom: 8px;
      transition: background 0.2s;
    }

    .winner-rank-item:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .rank-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .rank-medal-badge {
      font-size: 13px;
      font-weight: 950;
      min-width: 52px;
    }

    .rank-1 .rank-medal-badge { color: #ffd900; }
    .rank-2 .rank-medal-badge { color: #cbd5e1; }
    .rank-3 .rank-medal-badge { color: #d97706; }

    .winner-name-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .winner-name {
      font-size: 14.5px;
      font-weight: 900;
      color: #ffffff;
    }

    .winner-seq-tag {
      font-size: 11px;
      font-weight: 800;
      color: #34d399;
      font-family: monospace;
    }

    .winner-meta {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.55);
      margin-top: 2px;
    }

    .rank-right {
      text-align: right;
    }

    .winner-score {
      font-size: 15px;
      font-weight: 950;
      color: var(--gold-light);
    }

    .winner-time {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.45);
      margin-top: 2px;
    }

    .empty-state {
      text-align: center;
      padding: 24px 0;
      color: rgba(255, 255, 255, 0.4);
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 상단 헤더 배너 (이미지 구성 100% 반영) -->
    <header class="winners-hero-header">
      <div class="hero-badge-pill">SESSION QUIZ WINNERS</div>
      <h1 class="hero-title">
        <span>☕ 세션별 퀴즈 당첨자 (스타벅스 커피 쿠폰)</span>
      </h1>
      <p class="hero-desc">각 세션별 퀴즈 최고 득점자 및 최단시간 제출자 1~2위를 자동 집계합니다.</p>

      <!-- 당첨 산정 기준 배너 -->
      <div class="rules-banner" style="justify-content: flex-start;">
        <div class="rule-item star">
          <span>⭐ 산정 기준:</span>
          <span>① 가장 높은 점수 &gt; ② 가장 빠른 제출 시각 (세션별 1~2위 모바일 커피 쿠폰 증정)</span>
        </div>
      </div>

      <!-- 액션 툴바 -->
      <div class="hero-toolbar">
        <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
          <div id="quizSocketIndicator" style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 9999px; font-size: 12px; font-weight: 700; background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16, 185, 129, 0.35); color: #34d399;">
            <span id="quizSocketDot" style="width: 8px; height: 8px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981;"></span>
            <span id="quizSocketText">⚡ 실시간 소켓 스트림 연동 중 (0초 즉시 반영)</span>
          </div>
          <button class="btn-action" onclick="exportQuizSessionWinnersCsv()">
            📥 세션별 당첨자 CSV 다운로드
          </button>
          <button class="btn-action sec" onclick="syncAndRefreshQuizWinners(true)">
            🔄 순위 새로고침 (클라우드 동기화)
          </button>
          <button class="btn-action sec danger" onclick="purgeQuizSubmissionsFromScreen()" style="border-color: rgba(239, 68, 68, 0.45); color: #fca5a5;">
            🗑️ 퀴즈 풀이 이력 비우기
          </button>
        </div>

        <div style="display: flex; gap: 8px;">
          <button class="btn-action sec" id="btnFullscreenToggle" onclick="toggleFullScreen()">
            🖥️ 전체화면
          </button>
          <a class="btn-action sec" href="./admin.html" style="text-decoration: none;">
            ⚙️ 관리자 콘솔 ➔
          </a>
        </div>
      </div>
    </header>

    <!-- 세션별 당첨자 그리드 (Session 0 ~ Session 5) -->
    <main class="sessions-grid" id="quizSessionWinnersGrid">
      <!-- JS 동적 렌더링 -->
    </main>
  </div>

  <script>
    // 세션 정보 정의 (오프닝 + 세션 1~5)
    const QUIZ_SESSION_INFO = [
      { num: 0, tag: 'OPENING · 오프닝 퀴즈', speaker: 'ES엔지니어링담당', title: '세미나 개회 및 아이스브레이킹 퀴즈' },
      { num: 1, tag: 'KEYNOTE 1 · 주거난방', speaker: '여명석 교수 (서울대)', title: '국내 주거난방의 변천과 현황' },
      { num: 2, tag: 'KEYNOTE 2 · 액체냉각', speaker: '이성혁 교수 (중앙대)', title: 'AI 데이터센터 냉각 솔루션 기술 동향' },
      { num: 3, tag: 'KEYNOTE 3 · 전력시장', speaker: '조홍종 교수 (단국대)', title: '분산형 전원 체계와 AIDC 전력망의 미래' },
      { num: 4, tag: 'INSIGHT 1 · 히트펌프', speaker: '유정현 수석 (LHRI)', title: '헬로우 히트펌프, 굿바이 보일러' },
      { num: 5, tag: 'INSIGHT 2 · 컨설팅', speaker: '오영훈 팀장 (에너지컨설팅팀)', title: 'Building Decarbonization 종합 솔루션' }
    ];

    function getCheckinList() {
      try {
        return JSON.parse(localStorage.getItem('hvac_checkin_list') || '[]');
      } catch (e) {
        return [];
      }
    }

    function getQuizSubmissions() {
      try {
        const raw = localStorage.getItem('hvac_quiz_submissions');
        if (!raw) return [];
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
        if (typeof parsed === 'object') return Object.values(parsed).filter(Boolean);
        return [];
      } catch (e) {
        return [];
      }
    }

    function determineQuizSessionNum(q, idx) {
      if (!q) return 1;
      const tag = String(q.tag || '').toLowerCase();
      if (tag.includes('opening') || tag.includes('오프닝') || tag.includes('연습') || tag.includes('practice')) return 0;
      if (tag.includes('keynote 1') || tag.includes('keynote session 1') || tag.includes('주거난방') || tag.includes('여명석')) return 1;
      if (tag.includes('keynote 2') || tag.includes('keynote session 2') || tag.includes('액체냉각') || tag.includes('이성혁') || tag.includes('aidc')) return 2;
      if (tag.includes('keynote 3') || tag.includes('keynote session 3') || tag.includes('전력시장') || tag.includes('조홍종') || tag.includes('분산형')) return 3;
      if (tag.includes('insight 1') || tag.includes('insight session 1') || tag.includes('히트펌프') || tag.includes('유정현') || tag.includes('lhri')) return 4;
      if (tag.includes('insight 2') || tag.includes('insight session 2') || tag.includes('에너지') || tag.includes('오영훈') || tag.includes('컨설팅') || tag.includes('retrofit')) return 5;

      if (q.sessionNum !== undefined && q.sessionNum !== null && q.sessionNum !== '') {
        const sNum = parseInt(q.sessionNum, 10);
        if (!isNaN(sNum) && sNum >= 0 && sNum <= 5) return sNum;
      }

      if (idx === 0 || idx === 1) return 0;
      return Math.min(5, Math.floor((idx - 2) / 2) + 1);
    }

    function getQuizConfig() {
      try {
        const raw = localStorage.getItem('hvac_quiz_config');
        if (!raw) return [];
        let list = JSON.parse(raw);
        if (list && Array.isArray(list.quizzes)) list = list.quizzes;
        if (!Array.isArray(list)) return [];
        return list.map((q, idx) => ({
          ...q,
          sessionNum: determineQuizSessionNum(q, idx)
        }));
      } catch (e) {
        return [];
      }
    }

    function escapeHtml(str) {
      return String(str == null ? '' : str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      }[m]));
    }

    function findCheckinAttendeeInfo(name, email) {
      const list = getCheckinList();
      const cleanEmail = String(email || '').toLowerCase().replace('@lge.com', '').trim();
      return list.find(att => {
        const attClean = String(att.email || '').toLowerCase().replace('@lge.com', '').trim();
        return (cleanEmail && attClean === cleanEmail) || (att.name && att.name === name);
      }) || null;
    }

    function isQuizWinnerEligible(att, sub) {
      const email = String((att && att.email) || (sub && sub.email) || '').toLowerCase().replace('@lge.com', '').trim();
      const cat = String((att && (att.category || att.type)) || (sub && sub.category) || '').trim();

      // 사외 인원 제외
      if (cat.includes('사외') || cat.includes('외부') || cat.includes('강사') || cat.includes('교수') || cat.includes('학생')) return false;

      // 세미나 운영진 제외
      if ((att && att.isOperator) || (sub && sub.isOperator)) return false;
      if (window.HVAC && window.HVAC.isOperatorEmail && window.HVAC.isOperatorEmail(email)) return false;

      return true; // 사전등록, 초대(VIP), 하이엠 등 증정 대상
    }

    // ---------------------------------------------------------
    // 전체 세션 퀴즈 Top 3 산정 (이전 세션 당첨자 중복 제외 및 차순위 자동 배정)
    // ※ 세션 0(오프닝)은 몸풀기 연습 퀴즈로 경품 미제공, 세션 1부터 정식 집계
    // ---------------------------------------------------------
    function computeAllSessionQuizTop3() {
      const subs = getQuizSubmissions();
      const quizList = getQuizConfig();

      // 세션 0(오프닝)은 연습 퀴즈이므로 경품 집계 세션은 1~5만 해당
      const sessionNums = [1, 2, 3, 4, 5];
      const result = {
        bySession: { 0: [] },
        skippedBySession: { 0: [] },
        winnersEmailMap: {}
      };

      const wonEmailSet = new Set();
      const wonCheckinIdSet = new Set();

      sessionNums.forEach(sNum => {
        result.bySession[sNum] = [];
        result.skippedBySession[sNum] = [];

        const candidates = [];
        subs.forEach(sub => {
          const att = findCheckinAttendeeInfo(sub.name, sub.email);
          if (!isQuizWinnerEligible(att, sub)) return;

          let score = 0;
          let answered = 0;

          if (sub.sessionScores && sub.sessionScores[sNum] !== undefined) {
            score = Number(sub.sessionScores[sNum]) || 0;
            answered = Number(sub.sessionAnswered && sub.sessionAnswered[sNum]) || (score > 0 ? 1 : 0);
          } else if (sub.answers) {
            const sessQuestions = quizList.filter(q => Number(q.sessionNum) === sNum);
            sessQuestions.forEach(q => {
              const st = sub.answers[q.id];
              if (st && st.isDone) {
                answered++;
                score += (Number(st.score) || 0);
              }
            });
          } else if (sub.score > 0 && sub.answeredCount > 0) {
            // 구버전 또는 sessionScores 미저장 제출건에 대한 시계열 세션 순차 매핑 (오프닝: 0~1문항, 세션 1: 2~3문항, ...)
            const sessStartIdx = sNum === 0 ? 0 : (sNum * 2);
            if (sub.answeredCount > sessStartIdx) {
              const sessAnsweredCount = Math.min(2, Math.max(0, sub.answeredCount - sessStartIdx));
              const avgScorePerQuestion = sub.score / (sub.answeredCount || 1);
              score = Math.round(avgScorePerQuestion * sessAnsweredCount * 10) / 10;
              answered = sessAnsweredCount;
            }
          } else {
            // 세션별 답안 데이터가 없는 경우 임의 점수를 배정하지 않음 (0점 처리)
            score = 0;
            answered = 0;
          }

          if (score <= 0 && answered === 0) return;

          let ts = sub.timestamp || 0;
          if (!ts && sub.updatedAt) {
            try {
              const todayStr = new Date().toISOString().slice(0, 10);
              ts = new Date(`${todayStr} ${sub.updatedAt}`).getTime();
            } catch (e) {
              ts = Date.now();
            }
          }
          if (!ts) ts = 9999999999999;

          const seq = (att && att.seq) || sub.seq || null;
          const checkinId = (att && att.checkinId) || sub.checkinId || (seq ? ('HVAC-' + String(seq).padStart(3, '0')) : '-');
          const name = (att && att.name) || sub.name || '참석자';
          const dept = (att && (att.dept || att.org)) || sub.dept || 'ES엔지니어링담당';
          const category = (att && (att.category || att.type)) || sub.category || '사전등록';
          const email = (att && att.email) || sub.email || '';

          candidates.push({
            name,
            seq,
            checkinId,
            dept,
            category,
            email,
            score,
            timestamp: ts,
            timeText: sub.updatedAt || new Date(ts).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' })
          });
        });

        // 정렬: ① 높은 점수 > ② 빠른 제출 시각 > ③ 빠른 순번
        candidates.sort((a, b) => {
          if (b.score !== a.score) return b.score - a.score;
          if (a.timestamp !== b.timestamp) return a.timestamp - b.timestamp;
          return (a.seq || 9999) - (b.seq || 9999);
        });

        // 차순위 승계 필터링: 이미 이전 세션에서 당첨된 참가자는 중복 수령 방지를 위해 건너뛰고 차순위자가 승계
        for (let i = 0; i < candidates.length; i++) {
          const cand = candidates[i];
          const cleanEmail = (cand.email || '').toLowerCase().trim().replace('@lge.com', '');
          const cId = (cand.checkinId || '').trim();

          const isAlreadyWon = (cleanEmail && wonEmailSet.has(cleanEmail)) || (cId && cId !== '-' && wonCheckinIdSet.has(cId));

          if (isAlreadyWon) {
            result.skippedBySession[sNum].push({
              name: cand.name,
              email: cand.email,
              score: cand.score,
              originalRank: i + 1,
              reason: '이전 세션 중복 당첨 제외'
            });
            continue; // 차순위자에게 승계
          }

          result.bySession[sNum].push(cand);
          if (cleanEmail) wonEmailSet.add(cleanEmail);
          if (cId && cId !== '-') wonCheckinIdSet.add(cId);

          const winRank = result.bySession[sNum].length;
          if (cleanEmail) {
            result.winnersEmailMap[cleanEmail] = {
              sessionNum: sNum,
              rank: winRank,
              name: cand.name,
              score: cand.score
            };
          }

          if (result.bySession[sNum].length >= 2) {
            break;
          }
        }
      });

      return result;
    }

    function getSessionQuizTop3(targetSNum) {
      const all = computeAllSessionQuizTop3();
      return all.bySession[Number(targetSNum)] || [];
    }

    function loadQuizWinners(showFeedback = false) {
      const container = document.getElementById('quizSessionWinnersGrid');
      if (!container) return;

      const allData = computeAllSessionQuizTop3();

      container.innerHTML = QUIZ_SESSION_INFO.map(sess => {
        const isPractice = (sess.num === 0);
        const top3 = allData.bySession[sess.num] || [];
        const skipped = allData.skippedBySession[sess.num] || [];
        let itemsHtml = '';

        if (isPractice) {
          itemsHtml = `
            <div style="padding: 20px 14px; background: rgba(56, 189, 248, 0.08); border: 1px dashed rgba(56, 189, 248, 0.35); border-radius: 10px; color: #7dd3fc; font-size: 13px; text-align: center; line-height: 1.65;">
              🎯 <strong>오프닝 세션은 몸풀기 연습 퀴즈입니다.</strong><br>
              <span style="color: rgba(255,255,255,0.7); font-size: 12px;">참가자 여러분의 시스템 적응을 위한 연습 세션으로 경품이 제공되지 않으며,<br><strong>세션 1(Keynote 1)부터</strong> 각 세션별 1~2위 스타벅스 쿠폰이 정식 집계·증정됩니다.</span>
            </div>
          `;
        } else if (top3.length === 0) {
          itemsHtml = '<div class="empty-state">아직 세션 퀴즈 제출자가 없습니다.</div>';
        } else {
          itemsHtml = top3.map((w, idx) => {
            const medalClass = `rank-${idx + 1}`;
            const medal = idx === 0 ? '🥇 1등' : (idx === 1 ? '🥈 2등' : '🥉 3등');
            const seqTag = w.seq ? '#' + w.seq : '-';
            const scoreFormatted = (w.score % 1 === 0 ? w.score.toFixed(0) : w.score.toFixed(1));

            return `
              <div class="winner-rank-item ${medalClass}">
                <div class="rank-left">
                  <span class="rank-medal-badge">${medal}</span>
                  <div>
                    <div class="winner-name-wrap">
                      <strong class="winner-name">${escapeHtml(w.name)}</strong>
                      <span class="winner-seq-tag">(No. ${w.seq || '-'})</span>
                    </div>
                    <div class="winner-meta">
                      ${escapeHtml(w.dept)} · <span style="color: #94a3b8;">${escapeHtml(w.category)}</span>
                    </div>
                  </div>
                </div>

                <div class="rank-right">
                  <div class="winner-score">${scoreFormatted}점</div>
                  <div class="winner-time">${w.timeText}</div>
                </div>
              </div>
            `;
          }).join('');

          if (skipped.length > 0) {
            const uniqueSkippedNames = [...new Set(skipped.map(s => s.name))];
            itemsHtml += `
              <div style="margin-top: 8px; padding: 6px 10px; background: rgba(245,158,11,0.1); border: 1px dashed rgba(245,158,11,0.35); border-radius: 6px; font-size: 11px; color: #fbbf24;">
                ℹ️ <strong>중복 방지 차순위 승계:</strong> 이전 세션 당첨자 ${uniqueSkippedNames.map(escapeHtml).join(', ')} 님 제외 후 차순위자 자동 배정
              </div>
            `;
          }
        }

        const badgeHtml = isPractice
          ? `<span class="top3-pill" style="background: rgba(56,189,248,0.15); color: #38bdf8; border-color: rgba(56,189,248,0.35);">🎯 연습 퀴즈 (경품 미제공)</span>`
          : `<span class="top3-pill">☕ 1~2위 쿠폰</span>`;

        return `
          <article class="session-winner-card" style="${isPractice ? 'border-color: rgba(56,189,248,0.35);' : ''}">
            <div class="session-card-head">
              <div>
                <span class="sess-id" style="${isPractice ? 'color: #38bdf8;' : ''}">SESSION ${sess.num}</span>
                <h3 class="sess-title">${escapeHtml(sess.tag)}</h3>
                <div class="sess-speaker">${escapeHtml(sess.speaker)}</div>
              </div>
              ${badgeHtml}
            </div>
            <div>
              ${itemsHtml}
            </div>
          </article>
        `;
      }).join('');

      if (showFeedback) {
        alert('🔄 세션별 퀴즈 당첨자 순위가 최신 데이터로 새로고침되었습니다.');
      }
    }

    function exportQuizSessionWinnersCsv() {
      let csv = '\uFEFF세션번호,세션구분,세션주제및연사,순위,체크인순번,체크인ID,성명,소속(조직),구분,세션점수,제출시각,당첨경품,지급상태\n';
      QUIZ_SESSION_INFO.forEach(sess => {
        if (sess.num === 0) {
          csv += `"세션 0","${sess.tag}","${(sess.title || '').replace(/"/g, '""')} (연사: ${(sess.speaker || '').replace(/"/g, '""')})","-","-","-","(몸풀기 연습 퀴즈 - 경품 미제공)","-","-",0,"-","경품 미제공 (세션 1부터 증정)","연습세션"\n`;
          return;
        }
        const top3 = getSessionQuizTop3(sess.num);
        if (top3.length === 0) {
          csv += `"세션 ${sess.num}","${sess.tag}","${(sess.title || '').replace(/"/g, '""')} (연사: ${(sess.speaker || '').replace(/"/g, '""')})","-","-","-","(해당 세션 당첨자 없음)","-","-",0,"-","스타벅스 아메리카노 모바일 쿠폰","미지급"\n`;
        } else {
          top3.forEach((w, rankIdx) => {
            const seqStr = w.seq ? '#' + w.seq : '-';
            const checkinIdStr = w.checkinId || '-';
            const nameStr = (w.name || '').replace(/"/g, '""');
            const deptStr = (w.dept || '-').replace(/"/g, '""');
            const catStr = (w.category || '사전등록').replace(/"/g, '""');
            const scoreStr = (w.score % 1 === 0 ? w.score.toFixed(0) : w.score.toFixed(1));
            const timeStr = w.timeText || '-';
            csv += `"세션 ${sess.num}","${sess.tag}","${(sess.title || '').replace(/"/g, '""')} (연사: ${(sess.speaker || '').replace(/"/g, '""')})",${rankIdx + 1},"${seqStr}","${checkinIdStr}","${nameStr}","${deptStr}","${catStr}",${scoreStr},"${timeStr}","스타벅스 아메리카노 모바일 쿠폰","현장지급/모바일발송"\n`;
          });
        }
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `HVAC_2026_Quiz_Session_Winners_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function updateFullscreenBtnState() {
      const btn = document.getElementById('btnFullscreenToggle');
      if (btn) {
        btn.textContent = document.fullscreenElement ? '🗗 창 모드로 복귀 (ESC)' : '🖥️ 전체화면';
      }
    }

    document.addEventListener('fullscreenchange', updateFullscreenBtnState);

    // 클라우드 실시간 동기화 후 화면 새로고침
    async function syncAndRefreshQuizWinners(showFeedback = false) {
      if (window.HVAC && window.HVAC.cloud && typeof window.HVAC.cloud.getConfig === 'function') {
        const cfg = window.HVAC.cloud.getConfig();
        if (cfg && cfg.dbUrl && cfg.roomKey) {
          try {
            const base = cfg.dbUrl.replace(/\/+$/, '') + '/' + cfg.roomKey;
            const res = await fetch(base + '/quiz/submissions.json', { cache: 'no-store' });
            if (res.ok) {
              const subMap = await res.json();
              let list = [];
              if (subMap && typeof subMap === 'object') {
                list = Object.values(subMap).filter(Boolean);
              }
              localStorage.setItem('hvac_quiz_submissions', JSON.stringify(list));
            }
          } catch (e) {
            console.warn('Sync quiz error:', e);
          }
        }
      }
      loadQuizWinners(false);
      if (showFeedback) {
        const subs = getQuizSubmissions();
        alert(`🔄 클라우드와 실시간 동기화되었습니다. (현재 퀴즈 제출자: ${subs.length}건)`);
      }
    }

    // 전광판 화면에서 퀴즈 풀이 이력 완전 초기화 (원클릭 비우기)
    async function purgeQuizSubmissionsFromScreen() {
      const subs = getQuizSubmissions();
      const count = subs.length;
      if (!confirm(`🗑️ [퀴즈 풀이 이력 완전 초기화]\n\n현재 전광판 및 클라우드 DB에 남아 있는 참가자 퀴즈 풀이 이력(총 ${count}건)을 완전히 삭제하시겠습니까?\n\n삭제 즉시 모든 세션의 순위가 0건으로 리셋되며, 되돌릴 수 없습니다.`)) {
        return;
      }

      // 1. 로컬 스토리지 삭제
      localStorage.setItem('hvac_quiz_submissions', '[]');
      localStorage.removeItem('hvac_quiz_answers');
      localStorage.setItem('hvac_quiz_score', '0');

      // 2. Firebase 클라우드 DB 원격 비우기
      if (window.HVAC && window.HVAC.cloud && typeof window.HVAC.cloud.getConfig === 'function') {
        const cfg = window.HVAC.cloud.getConfig();
        if (cfg && cfg.dbUrl && cfg.roomKey) {
          const base = cfg.dbUrl.replace(/\/+$/, '') + '/' + cfg.roomKey;
          try {
            await fetch(base + '/quiz/submissions.json', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({})
            });
            await fetch(base + '/meta.json', {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ quiz: Date.now() })
            });
          } catch (cloudErr) {
            console.warn('Purge cloud quiz error:', cloudErr);
          }
        }
      }

      // 3. 브라우저 크로스 탭 알림 발송
      try {
        window.dispatchEvent(new StorageEvent('storage', { key: 'hvac_quiz_submissions' }));
      } catch (e) {}

      // 4. 화면 리렌더링
      loadQuizWinners(false);
      alert('✅ 퀴즈 풀이 이력 및 전광판 순위가 성공적으로 깨끗하게 초기화되었습니다. (현재 0건)');
    }

    // =========================================================
    // 전광판 화면 전용 Firebase RTDB 실시간 스트림 소켓 (SSE)
    // 참가자 퀴즈 답안 제출 즉시 0초 지연으로 수신하여 세션 Top 2 갱신
    // =========================================================
    let quizEventSource = null;
    let quizSubmissionsCache = {};

    function updateSocketStatusUi(connected) {
      const dot = document.getElementById('quizSocketDot');
      const text = document.getElementById('quizSocketText');
      const box = document.getElementById('quizSocketIndicator');
      if (!box || !dot || !text) return;
      if (connected) {
        box.style.background = 'rgba(16, 185, 129, 0.12)';
        box.style.borderColor = 'rgba(16, 185, 129, 0.35)';
        box.style.color = '#34d399';
        dot.style.background = '#10b981';
        dot.style.boxShadow = '0 0 8px #10b981';
        text.textContent = '⚡ 실시간 소켓 스트림 연동 (0초 즉시 반영)';
      } else {
        box.style.background = 'rgba(245, 158, 11, 0.12)';
        box.style.borderColor = 'rgba(245, 158, 11, 0.35)';
        box.style.color = '#fbbf24';
        dot.style.background = '#f59e0b';
        dot.style.boxShadow = '0 0 8px #f59e0b';
        text.textContent = '🔄 소켓 재연결 중 (폴링 백업 가동)';
      }
    }

    function initQuizSocketStream() {
      if (typeof window === 'undefined' || !window.EventSource) return;
      const cfg = (window.HVAC && window.HVAC.cloud && typeof window.HVAC.cloud.getConfig === 'function')
        ? window.HVAC.cloud.getConfig()
        : { dbUrl: 'https://lg-hvac-default-rtdb.asia-southeast1.firebasedatabase.app', roomKey: 'hvac2026' };
      if (!cfg || !cfg.dbUrl) return;

      const base = cfg.dbUrl.replace(/\/+$/, '') + '/' + cfg.roomKey;
      const streamUrl = base + '/quiz/submissions.json';

      if (quizEventSource) {
        try { quizEventSource.close(); } catch (e) {}
        quizEventSource = null;
      }

      try {
        quizEventSource = new EventSource(streamUrl);

        function handleQuizStream(payload) {
          if (!payload) return;
          const p = payload.path || '';
          const d = payload.data;

          if (p === '/' || p === '') {
            if (d && typeof d === 'object') {
              quizSubmissionsCache = { ...d };
            } else {
              quizSubmissionsCache = {};
            }
          } else {
            const parts = p.replace(/^\//, '').split('/');
            const userKey = parts[0];
            if (userKey) {
              if (parts.length === 1) {
                if (d === null) {
                  delete quizSubmissionsCache[userKey];
                } else {
                  quizSubmissionsCache[userKey] = d;
                }
              } else if (parts.length === 2 && quizSubmissionsCache[userKey]) {
                quizSubmissionsCache[userKey][parts[1]] = d;
              }
            }
          }

          const list = Object.values(quizSubmissionsCache).filter(Boolean);
          try {
            localStorage.setItem('hvac_quiz_submissions', JSON.stringify(list));
          } catch (e) {}
          loadQuizWinners(false);
        }

        quizEventSource.addEventListener('put', (e) => {
          if (!e || !e.data) return;
          try { handleQuizStream(JSON.parse(e.data)); } catch (err) {}
        });

        quizEventSource.addEventListener('patch', (e) => {
          if (!e || !e.data) return;
          try { handleQuizStream(JSON.parse(e.data)); } catch (err) {}
        });

        quizEventSource.onopen = () => {
          updateSocketStatusUi(true);
        };

        quizEventSource.onerror = () => {
          updateSocketStatusUi(false);
        };
      } catch (err) {
        console.warn('initQuizSocketStream error:', err);
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      loadQuizWinners();
      syncAndRefreshQuizWinners(false);
      initQuizSocketStream();
      setInterval(loadQuizWinners, 4000);
    });

    window.addEventListener('storage', (e) => {
      if (e.key === 'hvac_quiz_submissions') loadQuizWinners();
    });

    window.addEventListener('hvac:quiz-submissions-updated', () => {
      loadQuizWinners();
    });
  </script>
