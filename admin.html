<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>운영 관리자 센터 - 2026 HVAC Engineering Expert Seminar</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#060d09">

  <style id="gatewayStyles">
    :root {
      --bg: #060d09;
      --card-bg: rgba(13, 26, 18, 0.95);
      --card-border: rgba(16, 185, 129, 0.35);
      --primary: #059669;
      --primary-bright: #10b981;
      --primary-glow: rgba(16, 185, 129, 0.25);
      --text: #eaf3ed;
      --text-muted: #839d8d;
      --red: #ef4444;
      --font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 50% 20%, #0d2618 0%, #040906 80%);
      color: var(--text);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
      word-break: keep-all;
    }

    .gateway-box {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 40px 32px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 50px rgba(5, 150, 105, 0.2);
      text-align: center;
      position: relative;
      backdrop-filter: blur(12px);
    }

    .lock-icon-wrap {
      width: 72px;
      height: 72px;
      margin: 0 auto 22px;
      background: linear-gradient(135deg, rgba(5, 150, 105, 0.35), rgba(217, 119, 6, 0.25));
      border: 1px solid rgba(16, 185, 129, 0.5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      box-shadow: 0 0 28px rgba(16, 185, 129, 0.35);
      animation: pulseGlow 3s infinite alternate;
    }

    @keyframes pulseGlow {
      from { box-shadow: 0 0 20px rgba(16, 185, 129, 0.25); }
      to { box-shadow: 0 0 36px rgba(16, 185, 129, 0.55); }
    }

    .gateway-title {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .gateway-desc {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 26px;
    }

    .lock-input-group {
      position: relative;
      margin-bottom: 16px;
    }

    .lock-input {
      width: 100%;
      padding: 14px 48px 14px 16px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: all 0.25s ease;
      font-family: inherit;
    }

    .lock-input:focus {
      border-color: var(--primary-bright);
      box-shadow: 0 0 16px var(--primary-glow);
      background: rgba(0, 0, 0, 0.65);
    }

    .lock-toggle-pwd {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
    }

    .lock-toggle-pwd:hover {
      color: #fff;
    }

    .gateway-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 15.5px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(5, 150, 105, 0.4);
      transition: all 0.25s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .gateway-btn:hover {
      transform: translateY(-1.5px);
      box-shadow: 0 12px 28px rgba(16, 185, 129, 0.55);
    }

    .gateway-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .gateway-msg {
      margin-top: 14px;
      font-size: 13px;
      font-weight: 600;
      min-height: 20px;
    }

    .gateway-msg.error {
      color: #f87171;
    }

    .gateway-msg.info {
      color: #34d399;
    }

    .gateway-footer {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 12px;
      color: #60796b;
      line-height: 1.6;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="lockGateway" class="gateway-box">
    <div class="lock-icon-wrap">🔒</div>
    <h1 class="gateway-title">세미나 운영 관리자 센터</h1>
    <p class="gateway-desc">
      2026 HVAC Engineering Expert Seminar<br>
      보안 인증 암호를 입력하여 대시보드를 로드하세요.
    </p>

    <form id="gatewayForm" onsubmit="handleGatewaySubmit(event)">
      <div class="lock-input-group">
        <input
          type="password"
          id="adminPwdInput"
          class="lock-input"
          placeholder="관리자 인증 암호 입력"
          autocomplete="current-password"
          required
          autofocus
        >
        <button type="button" class="lock-toggle-pwd" id="btnTogglePwd" aria-label="비밀번호 보기">👁️</button>
      </div>

      <button type="submit" id="btnGatewaySubmit" class="gateway-btn">
        <span id="btnText">🔐 보안 인증 및 대시보드 로드</span>
      </button>

      <div id="gatewayMsg" class="gateway-msg"></div>
    </form>

    <div class="gateway-footer">
      🛡️ <strong>AES-256-GCM 보안 게이트웨이</strong><br>
      인증 전에는 참석자 명부 및 관리자 데이터가 노출되지 않습니다.<br>
      <a href="./index.html" style="color: var(--text-muted); text-decoration: underline; margin-top: 8px; display: inline-block;">
        ← 세미나 메인 페이지로 돌아가기
      </a>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      const BUNDLE_PATH = './assets/admin-core.enc';
      const SALT_LEN = 16;
      const IV_LEN = 12;
      const TAG_LEN = 16;
      const PBKDF2_ITERATIONS = 100000;

      const pwdInput = document.getElementById('adminPwdInput');
      const submitBtn = document.getElementById('btnGatewaySubmit');
      const btnText = document.getElementById('btnText');
      const msgEl = document.getElementById('gatewayMsg');
      const toggleBtn = document.getElementById('btnTogglePwd');

      // 비밀번호 표시 토글
      toggleBtn.addEventListener('click', () => {
        pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
      });

      // 상태 메시지 표출
      function setMessage(text, type = 'info') {
        msgEl.className = 'gateway-msg ' + type;
        msgEl.textContent = text;
      }

      function setLoading(isLoading, text = '') {
        submitBtn.disabled = isLoading;
        pwdInput.disabled = isLoading;
        if (isLoading) {
          btnText.innerHTML = '<div class="spinner"></div> ' + (text || '보안 인증 및 복호화 중...');
        } else {
          btnText.textContent = '🔐 보안 인증 및 대시보드 로드';
        }
      }

      /**
       * Web Crypto API (SubtleCrypto) 기반 AES-256-GCM 복호화
       */
      async function decryptAdminBundle(arrayBuffer, password) {
        if (arrayBuffer.byteLength < SALT_LEN + IV_LEN + TAG_LEN) {
          throw new Error('암호화 데이터가 손상되었습니다.');
        }

        const salt = arrayBuffer.slice(0, SALT_LEN);
        const iv = arrayBuffer.slice(SALT_LEN, SALT_LEN + IV_LEN);
        const cipherWithTag = arrayBuffer.slice(SALT_LEN + IV_LEN);

        // 1. Password -> PBKDF2 Key Material
        const keyMaterial = await crypto.subtle.importKey(
          'raw',
          new TextEncoder().encode(password),
          'PBKDF2',
          false,
          ['deriveKey']
        );

        // 2. Derive AES-GCM 256 Key
        const derivedKey = await crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: salt,
            iterations: PBKDF2_ITERATIONS,
            hash: 'SHA-256'
          },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );

        // 3. Decrypt Ciphertext + Tag
        const decryptedBuffer = await crypto.subtle.decrypt(
          {
            name: 'AES-GCM',
            iv: iv,
            tagLength: 128
          },
          derivedKey,
          cipherWithTag
        );

        return new TextDecoder().decode(decryptedBuffer);
      }

      /**
       * 복호화된 대시보드 문서를 브라우저 DOM에 마운트하고 스크립트 순차 실행
       */
      function mountDecryptedDashboard(decryptedHtml) {
        setMessage('🔓 인증 성공! 대시보드를 로드합니다...', 'info');

        // 1. Parse HTML
        const parser = new DOMParser();
        const doc = parser.parseFromString(decryptedHtml, 'text/html');

        // 2. Title 및 메타 업데이트
        if (doc.title) document.title = doc.title;

        // 3. 게이트웨이 스타일 및 박스 제거
        const gatewayStyle = document.getElementById('gatewayStyles');
        if (gatewayStyle) gatewayStyle.remove();
        const gatewayBox = document.getElementById('lockGateway');
        if (gatewayBox) gatewayBox.remove();

        // 4. 스타일 및 리소스 헤드 주입
        doc.head.querySelectorAll('style, link[rel="stylesheet"]').forEach(el => {
          document.head.appendChild(document.importNode(el, true));
        });

        // 5. Body 요소들 복사 (스크립트 제외)
        const bodyNodes = Array.from(doc.body.childNodes).filter(node => node.nodeName !== 'SCRIPT');
        bodyNodes.forEach(node => {
          document.body.appendChild(document.importNode(node, true));
        });

        // 6. 스크립트 순차 실행
        const scripts = Array.from(doc.querySelectorAll('script'));

        function executeNextScript(index) {
          if (index >= scripts.length) {
            // 모든 스크립트 로드 완료 후 대시보드 초기화
            setTimeout(() => {
              if (typeof window.initDashboard === 'function') {
                window.initDashboard();
              }
            }, 50);
            return;
          }

          const orig = scripts[index];
          const scriptEl = document.createElement('script');

          Array.from(orig.attributes).forEach(attr => {
            scriptEl.setAttribute(attr.name, attr.value);
          });

          if (orig.src) {
            scriptEl.onload = () => executeNextScript(index + 1);
            scriptEl.onerror = () => {
              console.error('스크립트 로드 실패:', orig.src);
              executeNextScript(index + 1);
            };
            document.body.appendChild(scriptEl);
          } else {
            scriptEl.textContent = orig.textContent;
            document.body.appendChild(scriptEl);
            executeNextScript(index + 1);
          }
        }

        executeNextScript(0);
      }

      /**
       * 게이트웨이 로그인 제출 처리
       */
      window.handleGatewaySubmit = async function (e) {
        if (e) e.preventDefault();
        const password = pwdInput.value.trim();
        if (!password) {
          setMessage('비밀번호를 입력해 주세요.', 'error');
          return;
        }

        setLoading(true, '암호 검증 및 번들 로딩...');
        setMessage('');

        try {
          const res = await fetch(BUNDLE_PATH + '?v=' + Date.now());
          if (!res.ok) throw new Error('암호화 번들 파일(admin-core.enc)을 불러올 수 없습니다.');
          const arrayBuffer = await res.arrayBuffer();

          setLoading(true, 'AES-256 복호화 중...');
          const decryptedHtml = await decryptAdminBundle(arrayBuffer, password);

          // 인증 성공 -> 세션 저장
          sessionStorage.setItem('hvac_admin_auth', 'true');
          sessionStorage.setItem('hvac_admin_auth_pass', password);

          // 대시보드 마운트
          mountDecryptedDashboard(decryptedHtml);
        } catch (err) {
          console.error(err);
          setLoading(false);
          setMessage('❌ 비밀번호가 올바르지 않습니다. 다시 입력해 주세요.', 'error');
          pwdInput.value = '';
          pwdInput.focus();
        }
      };

      /**
       * 세션 자동 복원 (새로고침 시)
       */
      async function tryRestoreSession() {
        const savedPass = sessionStorage.getItem('hvac_admin_auth_pass');
        const isAuth = sessionStorage.getItem('hvac_admin_auth') === 'true';

        if (savedPass && isAuth) {
          setLoading(true, '보안 세션 복원 중...');
          try {
            const res = await fetch(BUNDLE_PATH + '?v=' + Date.now());
            if (res.ok) {
              const arrayBuffer = await res.arrayBuffer();
              const decryptedHtml = await decryptAdminBundle(arrayBuffer, savedPass);
              mountDecryptedDashboard(decryptedHtml);
              return;
            }
          } catch (e) {
            console.warn('세션 복원 실패:', e);
            sessionStorage.removeItem('hvac_admin_auth');
            sessionStorage.removeItem('hvac_admin_auth_pass');
          }
          setLoading(false);
        }
      }

      // 페이지 로드 시 세션 복원 시도
      window.addEventListener('DOMContentLoaded', () => {
        tryRestoreSession();
      });

    })();
  </script>
</body>
</html>
